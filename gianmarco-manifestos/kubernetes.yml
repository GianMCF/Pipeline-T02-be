# MINIKUBE FUNCIONA EN CODESPACE | LOCAL
# KUBECTL FUNCIONA DIRECTO EN KILLERCODA (SIN MINIKUBE)

# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingresar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# crear un namespace "gianmarco" por comando mediante un archivo: "gianmarco-castillo-03-namespace.yml"
kubectl apply -f gianmarco-castillo-03-namespace.yml

# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "gianmarco-castillo-03-namespace"
kubectl config set-context --current --namespace=gianmarco-castillo-03-namespace

# consultar todos los recursos de un namespace "gianmarco-castillo-03-namespace"
kubectl get all -n gianmarco-castillo-03-namespace

# consultar todos los recursos y secret de un namespace "gianmarco-castillo-03-namespace"
kubectl get all,secrets -n gianmarco-castillo-03-namespace


# listar services del namespace "gianmarco-castillo-03-namespace"
minikube service gianmarco-castillo-03-service -n gianmarco-castillo-03-namespace
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/v1/api/customer
curl http://192.168.49.2:30001/v1/api/customer/1

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/gianmarco-castillo-03-service 8088:30001 -n gianmarco-castillo-03-namespace

